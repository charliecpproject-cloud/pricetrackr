<script>
(() => {
  'use strict';
  const data=JSON.parse(document.getElementById('map-data').textContent);
  const $=id=>document.getElementById(id), svg=$('graph'), viewport=$('viewport'), details=$('details');
  const state={scale:1,x:0,y:0,drag:false,start:null,selected:null};
  const esc=s=>String(s??'');
  const unique=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y)));
  $('title').textContent=data.repository.name+' — codebase map';
  $('subtitle').textContent=`${data.stats.files_analyzed} files · ${data.stats.relationships} relationships · ${data.repository.branch||'no branch'}`;
  document.documentElement.dataset.theme=localStorage.getItem('codebase-map-theme')||'dark';
  $('theme').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('codebase-map-theme',next)};

  function fillSelect(id,values){const select=$(id); values.forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;select.append(option)})}
  fillSelect('language',unique(data.files.map(f=>f.language)));
  fillSelect('role',unique(data.files.map(f=>f.role)));
  fillSelect('relation',unique(data.relationships.map(e=>e.type)));

  function treeData(){const root={children:new Map()};for(const file of data.files){let node=root;const parts=file.path.split('/');parts.forEach((part,index)=>{if(!node.children.has(part))node.children.set(part,{name:part,children:new Map(),file:index===parts.length-1?file:null});node=node.children.get(part)})}return root}
  function treeList(node){const ul=document.createElement('ul');for(const child of [...node.children.values()].sort((a,b)=>(!!a.file)-(!!b.file)||a.name.localeCompare(b.name))){const li=document.createElement('li');const button=document.createElement('button');button.textContent=child.name;if(child.file){button.className='file';button.onclick=()=>selectNode(child.file.path)}else{li.className='folder';button.onclick=()=>li.classList.toggle('closed')}li.append(button);if(child.children.size)li.append(treeList(child));ul.append(li)}return ul}
  $('tree').append(treeList(treeData()));

  function filters(){return {q:$('search').value.trim().toLowerCase(),language:$('language').value,role:$('role').value,relation:$('relation').value,inferred:$('inferred').checked}}
  function matches(file,f){const hay=[file.path,file.role,file.language,file.purpose,...file.symbols,...file.routes.flatMap(r=>[r.method,r.path])].join(' ').toLowerCase();return(!f.q||hay.includes(f.q))&&(!f.language||file.language===f.language)&&(!f.role||file.role===f.role)}
  function fileGraph(f){let files=data.files.filter(file=>matches(file,f)).slice(0,140);const ids=new Set(files.map(x=>x.path));let edges=data.relationships.filter(e=>ids.has(e.source)&&ids.has(e.target)&&(!f.relation||e.type===f.relation)&&(f.inferred||e.confidence==='Confirmed')).slice(0,260);const connected=new Set(edges.flatMap(e=>[e.source,e.target]));if(edges.length)files=files.filter(file=>connected.has(file.path)||file.importance>4);return {nodes:files.map(file=>({id:file.path,label:file.path.split('/').pop(),sub:file.role,role:file.role,raw:file})),edges}}
  function systemGraph(f){const selected=data.files.filter(file=>matches(file,f));const groups=new Map();selected.forEach(file=>{if(!groups.has(file.role))groups.set(file.role,[]);groups.get(file.role).push(file)});const nodes=[...groups].map(([role,files])=>({id:'role:'+role,label:role,sub:files.length+' files',role,raw:{role,files}}));const boundaryPrefixes=/^(external|database|storage|queue|endpoint|service|action|command|mcp|file):/;const boundaryTargets=unique([...data.external_systems.map(x=>'external:'+x),...data.relationships.map(e=>e.target).filter(x=>boundaryPrefixes.test(x))]).slice(0,16);for(const id of boundaryTargets){const kind=id.split(':')[0],label=id.slice(kind.length+1);const role=kind==='database'?'Database':kind==='storage'?'Storage':kind==='mcp'?'MCP':'External API';nodes.push({id,label,sub:kind.replace(/^./,x=>x.toUpperCase()),role,raw:{domain:label}})}const ids=new Set(nodes.map(n=>n.id)),counts=new Map();for(const edge of data.relationships){const source=data.files.find(x=>x.path===edge.source),target=data.files.find(x=>x.path===edge.target);if(!source)continue;const targetId=target?'role:'+target.role:(ids.has(edge.target)?edge.target:null);if(!targetId||target&&source.role===target.role)continue;const key=`role:${source.role}|${targetId}|${edge.type}`;counts.set(key,(counts.get(key)||0)+1)}const edges=[...counts].map(([key,count])=>{const [source,target,type]=key.split('|');return{source,target,type,symbol:count+' connections',confidence:'Strongly inferred',evidence:'Aggregated static relationships'}}).filter(e=>ids.has(e.source)&&ids.has(e.target)&&(!f.relation||e.type===f.relation));return{nodes,edges}}
  function flowGraph(f){const nodes=[],edges=[];for(const flow of data.flows){flow.stages.forEach((stage,index)=>{const id=flow.name+':'+index;nodes.push({id,label:stage.split('/').pop(),sub:flow.name,role:flow.kind==='data'?'Training pipeline':flow.kind==='deployment'?'Deployment':flow.kind==='ci'?'CI workflow':'API route / controller',raw:{flow,stage}});if(index)edges.push({source:flow.name+':'+(index-1),target:id,type:'flows to',symbol:flow.name,confidence:flow.confidence,evidence:flow.evidence.join(', ')})})}return{nodes:nodes.filter(n=>!f.q||[n.label,n.sub,n.raw.stage].join(' ').toLowerCase().includes(f.q)),edges}}
  function graphData(){const f=filters();return $('view').value==='files'?fileGraph(f):$('view').value==='flows'?flowGraph(f):systemGraph(f)}
  function svgEl(name,attrs={}){const el=document.createElementNS('http://www.w3.org/2000/svg',name);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);return el}
  function layout(nodes){const width=Math.max(760,svg.clientWidth),height=Math.max(520,svg.clientHeight),cols=Math.max(1,Math.ceil(Math.sqrt(nodes.length*width/height)));return new Map(nodes.map((node,index)=>[node.id,{x:90+(index%cols)*(Math.min(220,(width-100)/cols)),y:70+Math.floor(index/cols)*105}]))}
  function render(){viewport.replaceChildren();const graph=graphData(),positions=layout(graph.nodes),nodeIds=new Set(graph.nodes.map(n=>n.id));const edges=graph.edges.filter(e=>nodeIds.has(e.source)&&nodeIds.has(e.target));for(const edge of edges){const a=positions.get(edge.source),b=positions.get(edge.target);const line=svgEl('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge '+(edge.confidence==='Confirmed'?'':'inferred')});const title=svgEl('title');title.textContent=`${edge.type}: ${edge.confidence} — ${edge.evidence}`;line.append(title);viewport.append(line)}for(const node of graph.nodes){const p=positions.get(node.id),g=svgEl('g',{class:'node'+(state.selected===node.id?' selected':''),transform:`translate(${p.x-75} ${p.y-28})`,'data-role':node.role,tabindex:'0',role:'button'});const rect=svgEl('rect',{width:150,height:56});const label=svgEl('text',{x:10,y:23});label.textContent=node.label.length>22?node.label.slice(0,21)+'…':node.label;const sub=svgEl('text',{x:10,y:42,class:'sub'});sub.textContent=node.sub.length>25?node.sub.slice(0,24)+'…':node.sub;g.append(rect,label,sub);g.onclick=()=>selectNode(node.id,node);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(node.id,node)}};viewport.append(g)}$('status').textContent=`Showing ${graph.nodes.length} nodes · ${edges.length} edges`; $('empty').hidden=graph.nodes.length!==0;applyTransform()}
  function addSection(title,items){const h=document.createElement('h3');h.textContent=title;details.append(h);if(!items||!items.length){const p=document.createElement('p');p.textContent='None detected.';p.style.color='var(--muted)';details.append(p);return}const ul=document.createElement('ul');items.slice(0,40).forEach(value=>{const li=document.createElement('li');li.textContent=typeof value==='string'?value:JSON.stringify(value);ul.append(li)});details.append(ul)}
  function selectNode(id,node){state.selected=id;const file=data.files.find(f=>f.path===id);details.replaceChildren();const title=document.createElement('h2');title.textContent=file?file.path:(node?.label||id);details.append(title);if(file){const meta=document.createElement('p');meta.textContent=`${file.role} · ${file.language} · importance ${file.importance}`;meta.style.color='var(--muted)';details.append(meta);const purpose=document.createElement('p');purpose.textContent=file.purpose;details.append(purpose);addSection('Important symbols',file.symbols);addSection('Routes',file.routes.map(r=>`${r.method} ${r.path} — ${file.path}:${r.line}`));const outgoing=data.relationships.filter(e=>e.source===file.path);const incoming=data.relationships.filter(e=>e.target===file.path);addSection('Imports and calls',outgoing.map(e=>`${e.type} → ${e.target} (${e.confidence}; ${e.evidence})`));addSection('Dependants',incoming.map(e=>`${e.source} → ${e.type} (${e.confidence}; ${e.evidence})`));addSection('Data stores',outgoing.filter(e=>/^(database|storage|file):/.test(e.target)).map(e=>e.target));addSection('External systems',outgoing.filter(e=>/^(package|endpoint|action|service|queue|external|mcp):/.test(e.target)).map(e=>e.target));addSection('Environment names',file.env_vars)}else if(node?.raw?.files){const files=node.raw.files;const p=document.createElement('p');p.textContent=`${files.length} files in this architectural role.`;details.append(p);addSection('Files',files.map(f=>`${f.path} — ${f.purpose}`))}else if(node?.raw?.flow){const p=document.createElement('p');p.textContent=`${node.raw.flow.name}: ${node.raw.flow.confidence}`;details.append(p);addSection('Stages',node.raw.flow.stages);addSection('Evidence',node.raw.flow.evidence)}else{const p=document.createElement('p');p.textContent='External or aggregated architecture node.';details.append(p)}addSection('Legend',['Pink: frontend','Blue: API/service','Purple: database/data access','Green: ML/data pipeline','Orange: infrastructure/deployment','Yellow: tests','Solid edge: confirmed','Dashed edge: inferred or unresolved']);details.classList.add('open');render()}
  function applyTransform(){viewport.setAttribute('transform',`translate(${state.x} ${state.y}) scale(${state.scale})`)}
  function reset(){state.scale=1;state.x=0;state.y=0;applyTransform()}
  $('zoomIn').onclick=()=>{state.scale=Math.min(3,state.scale*1.2);applyTransform()};$('zoomOut').onclick=()=>{state.scale=Math.max(.25,state.scale/1.2);applyTransform()};$('reset').onclick=reset;
  svg.addEventListener('wheel',event=>{event.preventDefault();state.scale=Math.max(.25,Math.min(3,state.scale*(event.deltaY<0?1.1:.9)));applyTransform()},{passive:false});
  svg.addEventListener('pointerdown',event=>{state.drag=true;state.start={x:event.clientX-state.x,y:event.clientY-state.y};svg.setPointerCapture(event.pointerId)});svg.addEventListener('pointermove',event=>{if(!state.drag)return;state.x=event.clientX-state.start.x;state.y=event.clientY-state.start.y;applyTransform()});svg.addEventListener('pointerup',()=>state.drag=false);
  for(const id of ['search','view','language','role','relation','inferred'])$(id).addEventListener(id==='search'?'input':'change',()=>{state.selected=null;render()});
  const initial=document.createElement('p');initial.textContent='Select a node to inspect its purpose, symbols, routes, dependencies, confidence, and evidence.';details.append(initial);addSection('Repository', [`Root: ${data.repository.root}`,`Branch: ${data.repository.branch||'unknown'}`,`Commit: ${data.repository.commit||'unknown'}`,`Focus: ${data.repository.focus||'complete repository'}`]);addSection('Detected frameworks',data.frameworks);addSection('External systems',data.external_systems);addSection('Known risks',data.risks.map(r=>`${r.status}: ${r.message}`));
  render();
})();
